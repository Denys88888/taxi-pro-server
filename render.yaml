services:
  - type: web
    name: taxi-pro-server
    runtime: docker
    # Starter, not free, since 23 Aug 2026. Free instances spin down after 15
    # idle minutes and bill their hours against a 750-a-month pool shared by
    # every free service in the workspace — keeping this one warm exhausted
    # that pool and suspended pifix-api and stayfind-backend along with it.
    # Paid also unlocks a persistent disk, which is what SQLITE_PATH below
    # needs to survive a deploy.
    plan: starter
    envVars:
      - key: PORT
        value: 10000
      - key: PI_API_KEY
        sync: false
      - key: PI_SANDBOX
        value: true
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://denys88888.github.io
      # Not a secret — a DSN is a write-only ingest endpoint, the same shape
      # of thing a public API key is, and the frontend's own DSN ships inside
      # the JS bundle every visitor downloads. Committed as a plain value like
      # PI_SANDBOX above rather than sync: false, which is for things that
      # actually need to stay off GitHub.
      - key: SENTRY_DSN
        value: https://db84f22e5838deb30c569dda6e3dc890@o4511702917644288.ingest.de.sentry.io/4511978289365072
      # SQLite DB path, on the disk mounted below.
      - key: SQLITE_PATH
        value: /app/data/taxipro.db
    # Firestore's free 50k-reads/day quota capped this app at roughly 15
    # concurrent drivers before the database itself started refusing requests
    # (task #28's crash loop). The Starter plan above is what makes a disk
    # available at all; before that, mounting one wasn't an option and
    # Firestore was the only durable choice despite the ceiling.
    #
    # initStore() (src/models/index.ts) still prefers Firestore whenever
    # FIREBASE_* is set, so this disk taking effect is a two-step, reversible
    # switch, not something this file does by itself:
    #   1. Run `npm run migrate:sqlite` once (Render Shell, so it has the
    #      real FIREBASE_* creds already in the environment) to copy every
    #      Firestore document here. Read-only against Firestore — nothing
    #      there is touched, let alone deleted.
    #   2. Only once that has been checked, clear FIREBASE_PROJECT_ID /
    #      FIREBASE_CLIENT_EMAIL / FIREBASE_PRIVATE_KEY in the Render
    #      dashboard's Environment tab. initStore() then falls through to
    #      this disk. Re-adding those three values is an instant revert —
    #      Firestore was never written to, so nothing to undo there either.
    disk:
      name: taxipro-data
      mountPath: /app/data
      sizeGB: 1
