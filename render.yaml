services:
  - type: web
    name: taxi-pro-server
    runtime: docker
    # Starter, not free, since 23 Aug 2026. Free instances spin down after 15
    # idle minutes and bill their hours against a 750-a-month pool shared by
    # every free service in the workspace — keeping this one warm exhausted
    # that pool and suspended pifix-api and stayfind-backend along with it.
    # Paid also unlocks a persistent disk, which is what SQLITE_PATH below
    # needs to survive a deploy.
    plan: starter
    envVars:
      - key: PORT
        value: 10000
      - key: PI_API_KEY
        sync: false
      - key: PI_SANDBOX
        value: true
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://denys88888.github.io
      # Not a secret — a DSN is a write-only ingest endpoint, the same shape
      # of thing a public API key is, and the frontend's own DSN ships inside
      # the JS bundle every visitor downloads. Committed as a plain value like
      # PI_SANDBOX above rather than sync: false, which is for things that
      # actually need to stay off GitHub.
      - key: SENTRY_DSN
        value: https://db84f22e5838deb30c569dda6e3dc890@o4511702917644288.ingest.de.sentry.io/4511978289365072
      # SQLite DB path.
      #
      # WARNING: on the free plan the container filesystem is EPHEMERAL. With no
      # disk mounted at /app/data, every deploy and every restart destroys all
      # rides, payments and driver-payout records. For a payment app that means
      # unpaid payouts become unrecoverable.
      #
      # Pick one of:
      #   a) Firestore (free tier, recommended) — set FIREBASE_PROJECT_ID,
      #      FIREBASE_CLIENT_EMAIL and FIREBASE_PRIVATE_KEY above. The server
      #      prefers Firestore over SQLite automatically when they are present.
      #   b) A Render disk (paid plan) — uncomment the `disk` block below.
      - key: SQLITE_PATH
        value: /app/data/taxipro.db
    # disk:
    #   name: taxipro-data
    #   mountPath: /app/data
    #   sizeGB: 1
